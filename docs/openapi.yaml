openapi: 3.0.3
info:
  title: Helpdesk API
  version: 1.0.0
  description: Internal helpdesk REST API for PT Simple Journey Indonesia technical test.
servers:
  - url: http://localhost:8080/api
paths:
  /auth/register:
    post:
      summary: Register requester account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already registered
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
  /me:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /tickets:
    get:
      summary: List tickets
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: priority
          schema: { type: string }
        - in: query
          name: assignee_id
          schema: { type: string, format: uuid }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: sort_by
          schema: { type: string, default: created_at }
        - in: query
          name: sort_dir
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
    post:
      summary: Create ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created
  /tickets/{id}:
    get:
      summary: Ticket detail with comments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      summary: Update status, priority, or assignee
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: OK
        '422':
          description: Invalid status transition
  /tickets/{id}/comments:
    post:
      summary: Add comment or internal note
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Created
  /users:
    get:
      summary: List users (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /users/{id}/role:
    patch:
      summary: Update user role (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [requester, agent, admin]
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [requester, agent, admin] }
        created_at: { type: string, format: date-time }
    CreateTicketRequest:
      type: object
      required: [title, description, category, priority]
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        priority: { type: string, enum: [low, medium, high, urgent] }
    UpdateTicketRequest:
      type: object
      properties:
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        assignee_id: { type: string, format: uuid, nullable: true }
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
        is_internal: { type: boolean, default: false }
